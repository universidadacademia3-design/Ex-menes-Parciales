<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Exámenes Parciales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" onerror="window.__MAMMOTH_FAILED=true;"></script>
<!-- Firebase (base de datos compartida entre docente y estudiantes en producción) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* =========================================================================
   CONFIGURACIÓN DE FIREBASE
   =========================================================================
   Esta app necesita una base de datos compartida en la nube para que las
   pruebas creadas por el docente y las respuestas de los estudiantes se
   guarden en el mismo lugar (no solo en el navegador de cada persona).

   Firebase (Google) ofrece un plan gratuito ("Spark") más que suficiente
   para un curso universitario. Sigue los pasos del README.md para crear
   tu proyecto y reemplaza los valores de abajo por los tuyos.

   Mientras dejes "TU_API_KEY" sin cambiar, la aplicación funcionará en
   "modo local de prueba": los datos solo se guardan en el navegador
   actual y NO se comparten entre docente y estudiantes. Sirve para
   probar la interfaz, pero no para aplicar pruebas reales.
   ========================================================================= */

window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyDxaQMKvLzcVK8IsuyzrV5qgvDsdoGgMdE",
  authDomain: "plataforma-examenes-parciales.firebaseapp.com",
  projectId: "plataforma-examenes-parciales",
  storageBucket: "plataforma-examenes-parciales.firebasestorage.app",
  messagingSenderId: "345168657177",
  appId: "1:345168657177:web:c31f45352545eb9bdd6388"
};

</script>
<script>
/* =========================================================================
   ADAPTADOR DE ALMACENAMIENTO
   =========================================================================
   Provee window.storage.{get,set,delete,list} con la misma firma que usa
   la aplicación (key, shared) para que index.html no necesite cambios.

   - Si assets/firebase-config.js tiene llaves reales -> usa Firestore
     (compartido entre todos los usuarios: docente y estudiantes).
   - Si no -> usa localStorage del navegador (modo local de prueba,
     NO compartido entre dispositivos/personas).
   ========================================================================= */
(function(){
  const cfg = window.FIREBASE_CONFIG || {};
  const LS_PREFIX = 'pruebas_logistica__';
  let db = null;
  let auth = null;
  let useFirebase = false;

  if(cfg.apiKey && cfg.apiKey !== 'TU_API_KEY' && window.firebase){
    try{
      firebase.initializeApp(cfg);
      db = firebase.firestore();
      auth = firebase.auth();
      useFirebase = true;
    }catch(e){
      console.error('No se pudo inicializar Firebase, usando modo local.', e);
    }
  }
  window.STORAGE_MODE = useFirebase ? 'firebase' : 'local';

  async function fbGet(key){
    const doc = await db.collection('storage').doc(key).get();
    return doc.exists ? { key, value: doc.data().value } : null;
  }
  async function fbSet(key, value, extra){
    await db.collection('storage').doc(key).set(Object.assign({ value, updated: Date.now() }, extra||{}));
    return { key, value };
  }
  async function fbDelete(key){
    await db.collection('storage').doc(key).delete();
    return { key, deleted: true };
  }
  async function fbList(prefix){
    // Nota: en un curso pequeño esto es suficiente. Para volúmenes grandes,
    // conviene indexar por colección/subcolección en vez de filtrar en cliente.
    const snap = await db.collection('storage').get();
    const keys = [];
    snap.forEach(d => { if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
    return { keys };
  }

  function lsGet(key){
    const v = localStorage.getItem(LS_PREFIX + key);
    return v != null ? { key, value: v } : null;
  }
  function lsSet(key, value){
    localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  }
  function lsDelete(key){
    localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true };
  }
  function lsList(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k.startsWith(LS_PREFIX)){
        const real = k.slice(LS_PREFIX.length);
        if(!prefix || real.startsWith(prefix)) keys.push(real);
      }
    }
    return { keys };
  }

  window.storage = {
    async get(key, _shared){
      try{ return useFirebase ? await fbGet(key) : lsGet(key); }
      catch(e){ console.error('storage.get', e); return null; }
    },
    async set(key, value, _shared, extra){
      try{ return useFirebase ? await fbSet(key, value, extra) : lsSet(key, value); }
      catch(e){ console.error('storage.set', e); return null; }
    },
    async delete(key, _shared){
      try{ return useFirebase ? await fbDelete(key) : lsDelete(key); }
      catch(e){ console.error('storage.delete', e); return null; }
    },
    async list(prefix, _shared){
      try{ return useFirebase ? await fbList(prefix) : lsList(prefix); }
      catch(e){ console.error('storage.list', e); return { keys: [] }; }
    }
  };

  // ---------------- Cuentas de docente (Firebase Authentication) ----------------
  window.authAdapter = {
    disponible: useFirebase,
    async registrar(nombre, correo, contrasena){
      if(!useFirebase) return { ok:false, error:'Las cuentas de docente requieren Firebase configurado.' };
      try{
        const cred = await auth.createUserWithEmailAndPassword(correo, contrasena);
        await cred.user.updateProfile({ displayName: nombre });
        return { ok:true, uid: cred.user.uid, nombre, correo };
      }catch(e){
        return { ok:false, error: mensajeErrorAuth(e) };
      }
    },
    async iniciarSesion(correo, contrasena){
      if(!useFirebase) return { ok:false, error:'Las cuentas de docente requieren Firebase configurado.' };
      try{
        const cred = await auth.signInWithEmailAndPassword(correo, contrasena);
        return { ok:true, uid: cred.user.uid, nombre: cred.user.displayName || correo, correo: cred.user.email };
      }catch(e){
        return { ok:false, error: mensajeErrorAuth(e) };
      }
    },
    async iniciarSesionGoogle(){
      if(!useFirebase) return { ok:false, error:'Las cuentas de docente requieren Firebase configurado.' };
      try{
        const provider = new firebase.auth.GoogleAuthProvider();
        const cred = await auth.signInWithPopup(provider);
        return { ok:true, uid: cred.user.uid, nombre: cred.user.displayName || cred.user.email, correo: cred.user.email };
      }catch(e){
        if(e.code === 'auth/popup-closed-by-user') return { ok:false, error:'Se cerró la ventana de Google antes de terminar.' };
        return { ok:false, error: mensajeErrorAuth(e) };
      }
    },
    async cerrarSesion(){
      if(useFirebase) await auth.signOut();
    },
    async recuperarContrasena(correo){
      if(!useFirebase) return { ok:false, error:'No disponible en modo local.' };
      try{ await auth.sendPasswordResetEmail(correo); return { ok:true }; }
      catch(e){ return { ok:false, error: mensajeErrorAuth(e) }; }
    },
    async sesionActual(){
      if(!useFirebase) return null;
      return new Promise(resolve=>{
        const unsub = auth.onAuthStateChanged(user=>{
          unsub();
          if(!user){ resolve(null); return; }
          resolve({ uid:user.uid, nombre:user.displayName || user.email, correo:user.email });
        });
      });
    }
  };
  function mensajeErrorAuth(e){
    const map = {
      'auth/email-already-in-use': 'Ya existe una cuenta con ese correo. Inicie sesión en vez de crear una nueva.',
      'auth/invalid-email': 'El correo no tiene un formato válido.',
      'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
      'auth/user-not-found': 'No existe una cuenta con ese correo.',
      'auth/wrong-password': 'La contraseña es incorrecta.',
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
      'auth/too-many-requests': 'Demasiados intentos. Espere unos minutos e intente de nuevo.',
      'auth/popup-blocked': 'El navegador bloqueó la ventana de Google. Permita ventanas emergentes para este sitio e intente de nuevo.',
      'auth/account-exists-with-different-credential': 'Ya existe una cuenta con ese correo creada con contraseña. Inicie sesión con correo y contraseña.',
      'auth/unauthorized-domain': 'Este sitio todavía no está autorizado para iniciar sesión con Google (falta agregarlo en Firebase, ver README.md).',
    };
    return map[e.code] || ('No se pudo completar la operación (' + (e.code||e.message) + ').');
  }

  document.addEventListener('DOMContentLoaded', function(){
    if(!useFirebase){
      const b = document.createElement('div');
      b.style.cssText = 'background:#B3382C;color:#fff;text-align:center;padding:9px 14px;'
        + 'font:600 12.5px Inter,sans-serif;letter-spacing:.01em;position:relative;z-index:9999;';
      b.textContent = '⚠ Modo local de prueba: los datos solo se guardan en este navegador y no se comparten entre docente y estudiantes. Configura Firebase (ver README.md) antes de aplicar pruebas reales.';
      document.body.prepend(b);
    }
  });
})();

</script>
<style>
:root{
  --navy:#12233F;
  --navy-deep:#0A1728;
  --steel:#2C6E91;
  --steel-soft:#DCE9EF;
  --gold:#C4923A;
  --gold-soft:#F3E3C4;
  --paper:#F6F3EC;
  --paper-line:#E3DDCC;
  --ink:#1B1B1B;
  --ink-soft:#5B5F66;
  --success:#2F7D4F;
  --success-soft:#E1EFE5;
  --danger:#B3382C;
  --danger-soft:#F7E3DF;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px);
  background-size: 100% 42px;
  opacity:.35;
  pointer-events:none;
  z-index:0;
}
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}
h1,h2,h3,h4{font-family:'Source Serif 4',serif; margin:0; color:var(--navy-deep);}
.mono{font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;}
a{color:var(--steel);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- top bar ---------- */
.topbar{
  background:var(--navy-deep);
  color:#EDE8DA;
  padding:10px 24px;
  display:flex; align-items:center; justify-content:space-between;
  font-size:12.5px;
  letter-spacing:.04em;
}
.topbar .route{
  display:flex; align-items:center; gap:8px;
  font-family:'IBM Plex Mono',monospace;
  color:#B9C4D6;
}
.topbar .route .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}
.topbar button.link-btn{
  background:none;border:1px solid #3A4A66;color:#DCE3EE;
  padding:5px 12px;border-radius:20px;font-size:12px;
}
.topbar button.link-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ---------- header institucional (manifiesto) ---------- */
.manifest-header{
  background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  color:#fff;
  padding:34px 28px 26px;
  position:relative;
  overflow:hidden;
}
.manifest-header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:6px;
  background:repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 22px);
}
.manifest-header .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--gold-soft); opacity:.85; margin-bottom:10px;
}
.manifest-header .inst{max-width:760px; margin:0 auto; text-align:center;}
.manifest-header .inst p{margin:2px 0; font-size:13.5px; color:#CBD5E3;}
.manifest-header .inst p.top{font-size:14.5px; font-weight:600; color:#fff; letter-spacing:.01em;}
.manifest-header h1{color:#fff; font-size:22px; margin-top:10px; font-weight:600;}
.manifest-header .subject{
  display:inline-block; margin-top:8px; font-size:12.5px;
  border:1px solid #3A4A66; padding:5px 14px; border-radius:20px; color:var(--gold-soft);
  font-family:'IBM Plex Mono',monospace; letter-spacing:.03em;
}

/* ---------- shell / layout ---------- */
.shell{flex:1; width:100%; max-width:980px; margin:0 auto; padding:30px 22px 70px;}
.shell.wide{max-width:1180px;}
.card{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:26px;
  box-shadow:0 1px 2px rgba(18,35,63,.04);
  margin-bottom:20px;
}
.card + .card{margin-top:0;}
.section-label{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--steel); margin-bottom:6px; display:block;
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}

label.field-label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%; padding:10px 12px; border:1.5px solid #D9D3C3; border-radius:8px;
  font-size:14.5px; color:var(--ink); background:#FCFBF8; transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--steel); background:#fff;}
textarea{resize:vertical; min-height:90px; font-family:'IBM Plex Mono',monospace; font-size:13px;}

.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  padding:11px 20px; border-radius:8px; border:none; font-weight:600; font-size:14px;
  transition:transform .08s, box-shadow .15s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-deep);}
.btn-gold{background:var(--gold); color:#2A1E08;}
.btn-gold:hover{filter:brightness(1.06);}
.btn-ghost{background:#fff; border:1.5px solid #D9D3C3; color:var(--ink);}
.btn-ghost:hover{border-color:var(--steel); color:var(--steel);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:6px;}

.role-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:26px;}
@media(max-width:640px){.role-grid{grid-template-columns:1fr;}}
.role-card{
  background:#fff; border:1.5px solid var(--paper-line); border-radius:14px; padding:28px 24px;
  cursor:pointer; transition:border-color .15s, transform .1s;
  text-align:left;
}
.role-card:hover{border-color:var(--gold); transform:translateY(-2px);}
.role-card .tag{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); letter-spacing:.1em; text-transform:uppercase;}
.role-card h3{margin-top:10px; font-size:20px;}
.role-card p{color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin-top:8px;}

/* waybill-style landing hero */
.hero-ticket{
  background:#fff; border:1.5px dashed #C9C2AC; border-radius:14px; padding:24px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.hero-ticket .lane{flex:1; min-width:220px;}
.hero-ticket .lane .k{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:.1em; text-transform:uppercase;}
.hero-ticket .lane .v{font-size:14px; margin-top:3px; font-weight:600;}

/* alert / notice boxes */
.notice{border-radius:8px; padding:14px 16px; font-size:13.5px; line-height:1.55; border:1px solid transparent;}
.notice.warn{background:var(--gold-soft); border-color:#E3C688; color:#5C4113;}
.notice.danger{background:var(--danger-soft); border-color:#E4B3A9; color:#7A231A;}
.notice.info{background:var(--steel-soft); border-color:#B7D1DE; color:#1D4B62;}
.notice.success{background:var(--success-soft); border-color:#B6DAC1; color:#1F5C39;}
.notice ul{margin:8px 0 0 18px; padding:0;}
.notice li{margin-bottom:3px;}

/* code chip */
.code-chip{
  display:inline-flex; align-items:center; gap:10px;
  background:var(--navy-deep); color:var(--gold-soft);
  font-family:'IBM Plex Mono',monospace; font-size:15px; letter-spacing:.08em;
  padding:9px 16px; border-radius:8px;
}
.code-chip .bars{display:flex; gap:2px; align-items:flex-end;}
.code-chip .bars span{display:block; width:2px; background:var(--gold);}

/* route progress (question stepper) */
.route-track{display:flex; align-items:center; gap:0; margin:4px 0 22px; overflow-x:auto; padding-bottom:4px;}
.route-track .wp{
  width:28px; height:28px; min-width:28px; border-radius:50%; background:#EDE9DD; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;
  font-family:'IBM Plex Mono',monospace; border:2px solid #EDE9DD; z-index:1;
}
.route-track .wp.done{background:var(--steel); border-color:var(--steel); color:#fff;}
.route-track .wp.active{background:var(--gold); border-color:var(--gold); color:#2A1E08;}
.route-track .seg{flex:1; height:2px; background:#EDE9DD; min-width:14px;}
.route-track .seg.done{background:var(--steel);}

.qtimer{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);
  display:flex; align-items:center; gap:6px;
}
.qtimer .led{width:7px;height:7px;border-radius:50%; background:var(--danger); animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.opt-row{
  display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border:1.5px solid #E4DFD1;
  border-radius:8px; margin-bottom:9px; cursor:pointer; transition:border-color .12s, background .12s;
}
.opt-row:hover{border-color:var(--steel);}
.opt-row.selected{border-color:var(--steel); background:var(--steel-soft);}
.opt-row input{margin-top:3px;}
.opt-row .letter{
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; color:var(--steel);
  border:1.5px solid var(--steel); width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

table.report{width:100%; border-collapse:collapse; font-size:13.5px;}
table.report th{
  text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); border-bottom:2px solid var(--navy); padding:8px 10px;
}
table.report td{padding:9px 10px; border-bottom:1px solid var(--paper-line); vertical-align:top;}
table.report tr:hover td{background:#FBF9F4;}
.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.02em;}
.badge.ok{background:var(--success-soft); color:var(--success);}
.badge.bad{background:var(--danger-soft); color:var(--danger);}
.badge.progress{background:var(--gold-soft); color:#6B4B15;}

.score-hero{text-align:center; padding:34px 20px;}
.score-hero .ring{
  width:140px; height:140px; border-radius:50%; margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  background:conic-gradient(var(--steel) calc(var(--pct)*1%), #EDE9DD 0);
}
.score-hero .ring .inner{
  width:112px; height:112px; border-radius:50%; background:#fff;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
}
.score-hero .ring .num{font-family:'Source Serif 4',serif; font-size:34px; color:var(--navy-deep); font-weight:700; line-height:1;}
.score-hero .ring .of{font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

.qa-review{border:1px solid var(--paper-line); border-radius:8px; padding:14px 16px; margin-bottom:10px;}
.qa-review.correct{border-left:4px solid var(--success);}
.qa-review.incorrect{border-left:4px solid var(--danger);}
.qa-review .qtext{font-weight:600; font-size:14px; margin-bottom:8px;}
.qa-review .arow{font-size:13px; margin:3px 0; color:var(--ink-soft);}
.qa-review .arow b{color:var(--ink); font-weight:600;}

.footer-note{text-align:center; color:var(--ink-soft); font-size:11.5px; padding:20px; font-family:'IBM Plex Mono',monospace; letter-spacing:.03em;}
@media print{
  .topbar, .no-print, .footer-note{display:none !important;}
  body::before{display:none;}
  .card{box-shadow:none; border:1px solid #ccc;}
}

.q-editor{border:1px solid var(--paper-line); border-radius:8px; padding:16px; margin-bottom:14px; background:#FBF9F4;}
.q-editor .row-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.q-editor .idx{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--steel); font-weight:700;}
.opt-edit-row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
.opt-edit-row input[type=text]{flex:1;}
.small-x{background:none; border:none; color:var(--danger); font-size:16px; padding:2px 8px;}

.tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1.5px solid var(--paper-line);}
.tab-btn{background:none; border:none; padding:10px 4px; margin-right:22px; font-weight:600; font-size:14px;
  color:var(--ink-soft); border-bottom:2.5px solid transparent; margin-bottom:-1.5px;}

const PIN_DOCENTE = 'CRUV-2026'; // clave de acceso docente "de fábrica" para el modo local (sin cuentas)
async function getPinVigente(){
  const cfg = await stGet('config:acceso');
  return (cfg && cfg.pin) ? cfg.pin : PIN_DOCENTE;
}
async function cambiarPin(nuevoPin){
  return await stSet('config:acceso', { pin: nuevoPin, actualizado: Date.now() });
}
function claveAsignaturas(){
  const uid = (APP.docenteAuth && APP.docenteAuth.uid) ? APP.docenteAuth.uid : 'local';
  return 'config:asignaturas:'+uid;
}
async function obtenerAsignaturas(){
  const cfg = await stGet(claveAsignaturas());
  return (cfg && Array.isArray(cfg.lista)) ? cfg.lista : [];
}
async function registrarAsignatura(nombre){
  const lista = await obtenerAsignaturas();
  if(!lista.some(a=>normText(a)===normText(nombre))){
    lista.push(nombre);
    await stSet(claveAsignaturas(), { lista });
  }
}
async function obtenerProfesores(){
  const cfg = await stGet('config:profesores');
  return (cfg && Array.isArray(cfg.lista)) ? cfg.lista : [];
}
async function registrarProfesor(nombre){
  if(!nombre) return;
  const lista = await obtenerProfesores();
  if(!lista.some(p=>normText(p)===normText(nombre))){
    lista.push(nombre);
    await stSet('config:profesores', { lista });
  }
}

/* ---------------------------- almacenamiento ---------------------------- */
async function stGet(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function stSet(key, value, extra){
  try{ const r = await window.storage.set(key, JSON.stringify(value), true, extra); return !!r; }
  catch(e){ console.error('storage set error', e); return false; }
}
async function stList(prefix){
  try{ const r = await window.storage.list(prefix, true); return r ? r.keys : []; }
  catch(e){ return []; }
}
async function stDelete(key){
  try{ await window.storage.delete(key, true); }catch(e){}
}

/* --------------------------------- utils --------------------------------- */
function uid(n=6){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<n;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function genCodigo(modulo){
  const pre = (modulo||'LOG').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || 'LOG';
  return pre + '-' + uid(5);
}
function hashSeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return h>>>0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function shuffleSeeded(arr, seedStr){
  const rnd = mulberry32(hashSeed(seedStr));
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowTimeStr(){ return new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normText(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}
// Compatibilidad: pruebas creadas antes de que existiera el modo de tiempo
// (solo tenían "duracionMinutos") se tratan como modo "total".
function normalizarTiempoTest(test){
  if(test && !test.tipoTiempo){
    test.tipoTiempo = test.duracionMinutos ? 'total' : 'ninguno';
  }
  return test;
}

/* ---------------------- parser de documento de preguntas ---------------------- */
// Formato admitido (texto plano, separado por bloques):
// MODULO: ...
// TIPO: prueba_corta | parcial
// INSTRUCCIONES: ...
// PREGUNTA: ...
// TIPO_PREGUNTA: seleccion | vf | corta
// PUNTOS: 10        (opcional)
// OPCION: ...        (solo para seleccion, repetir por cada opción)
// RESPUESTA: ...
function parseDocumento(text){
  const lines = text.split(/\r?\n/);
  const meta = { asignatura:'', profesor:'', modulo:'', tipoPrueba:'prueba_corta', instrucciones:'' };
  const preguntas = [];
  let cur = null;

  function pushCur(){
    if(cur && cur.texto){ preguntas.push(cur); }
    cur = null;
  }

  for(let raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const m = line.match(/^([A-Za-zÁÉÍÓÚÑ_]+)\s*:\s*(.*)$/);
    if(!m){ continue; }
    const key = m[1].toUpperCase();
    const val = m[2].trim();
    switch(key){
      case 'ASIGNATURA': meta.asignatura = val; break;
      case 'PROFESOR': meta.profesor = val; break;
      case 'MODULO': meta.modulo = val; break;
      case 'TIPO':
        meta.tipoPrueba = /parcial/i.test(val) ? 'parcial' : 'prueba_corta';
        break;
      case 'INSTRUCCIONES': meta.instrucciones = val; break;
      case 'PREGUNTA':
        pushCur();
        cur = { id: uid(8), texto: val, tipo:'seleccion', puntos:null, opciones:[], respuesta:'' };
        break;
      case 'TIPO_PREGUNTA':
        if(cur){
          const v = val.toLowerCase();
          cur.tipo = v.startsWith('v') ? 'vf' : (v.startsWith('c') ? 'corta' : 'seleccion');
        }
        break;
      case 'PUNTOS':
        if(cur) cur.puntos = parseFloat(val) || null;
        break;
      case 'OPCION':
        if(cur) cur.opciones.push(val);
        break;
      case 'RESPUESTA':
        if(cur) cur.respuesta = val;
        break;
      default: break;
    }
  }
  pushCur();

  // normalizar V/F opciones
  preguntas.forEach(p=>{
    if(p.tipo==='vf'){ p.opciones = ['Verdadero','Falso']; }
  });

  return { meta, preguntas };
}

function repartirPuntos(preguntas){
  const conPuntos = preguntas.filter(p=>p.puntos);
  const sinPuntos = preguntas.filter(p=>!p.puntos);
  let usados = conPuntos.reduce((a,p)=>a+p.puntos,0);
  if(sinPuntos.length){
    const restante = Math.max(0, 100 - usados);
    const cada = Math.round((restante / sinPuntos.length) * 100) / 100;
    sinPuntos.forEach((p,i)=>{ p.puntos = (i===sinPuntos.length-1) ? Math.round((restante - cada*(sinPuntos.length-1))*100)/100 : cada; });
  }
  return preguntas;
}

/* ------------------------------- calificación ------------------------------- */
function evaluarRespuesta(pregunta, respuestaEstudiante){
  if(pregunta.tipo==='corta'){
    return normText(respuestaEstudiante) !== '' && normText(respuestaEstudiante) === normText(pregunta.respuesta)
      ? true
      : (normText(pregunta.respuesta).length>0 && normText(respuestaEstudiante).includes(normText(pregunta.respuesta)));
  }
  return normText(respuestaEstudiante) === normText(pregunta.respuesta);
}

function TopBar(){

    docenteCrear:'docente / nueva prueba', docenteReporte:'docente / informe',
    docenteReporteAsignatura:'docente / informe de asignatura',
    estAcceso:'estudiante / acceso', estDatos:'estudiante / datos', estPrueba:'estudiante / en curso',
    estResultado:'estudiante / resultado', estBloqueado:'estudiante / bloqueado'
  })[APP.view] || 'inicio';
  bar.innerHTML = `
    <div class="route"><span class="dot"></span><span>examenes-parciales</span><span>/</span><span>${routeText}</span></div>
    <div></div>`;
  const btnWrap = document.createElement('div');
  if(APP.view !== 'home' && APP.view !== 'estPrueba'){
    const b = document.createElement('button');
    b.className='link-btn';
    b.textContent='◂ Inicio';
    b.onclick = ()=>{ APP.view='home'; APP.ctx={}; render(); };
    btnWrap.appendChild(b);
  }
  bar.lastElementChild.replaceWith(btnWrap);
  return bar;
}

        <button class="btn btn-primary btn-block" id="pinBtn" style="margin-top:16px;">Ingresar al panel</button>
        <div class="help-block" style="margin-top:18px;">

        </div>

      const btn=document.getElementById('pinBtn');
      const input=document.getElementById('pinInput');
      const tryLogin=async ()=>{
        btn.disabled = true;
        const pinVigente = await getPinVigente();
        btn.disabled = false;
        if(input.value.trim()===pinVigente){
          APP.docenteAuth = { uid:null, nombre:'Docente (modo local)', correo:null };
          APP.view='docenteDashboard'; render();
        } else {
          document.getElementById('pinError').style.display='block';
        }
      };
      btn.onclick=tryLogin;
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
      input.focus();
    });
    return wrap;
  }

  const modo = APP.ctx.loginModo || 'login'; // 'login' | 'registro'

  shell.innerHTML = `
    <div class="card">
      <div class="tabs" style="margin-bottom:18px;">
        <button class="tab-btn ${modo==='login'?'active':''}" id="tabLogin">Iniciar sesión</button>
        <button class="tab-btn ${modo==='registro'?'active':''}" id="tabRegistro">Crear cuenta</button>
      </div>

      <button class="btn btn-ghost btn-block" id="btnGoogle" style="border-color:#D9D3C3; gap:10px;">

        Continuar con Google
      </button>

        const pass = document.getElementById('regPass').value;

        const err = document.getElementById('regError');
        err.style.display='none';
        if(!nombre || !correo || !pass){ err.textContent='Complete todos los campos.'; err.style.display='block'; return; }
        if(pass.length < 6){ err.textContent='La contraseña debe tener al menos 6 caracteres.'; err.style.display='block'; return; }
        if(pass !== pass2){ err.textContent='Las contraseñas no coinciden.'; err.style.display='block'; return; }
        btn.disabled = true; btn.textContent = 'Creando cuenta…';
        const r = await window.authAdapter.registrar(nombre, correo, pass);
        btn.disabled = false; btn.textContent = 'Crear mi cuenta';
        if(!r.ok){ err.textContent = r.error; err.style.display='block'; return; }
        APP.docenteAuth = { uid:r.uid, nombre:r.nombre, correo:r.correo };
        APP.view='docenteDashboard'; render();
      };
      btn.onclick = doRegistro;
    }
  });
  return wrap;
}

/* VIEW: DOCENTE DASHBOARD                                               */
/* ===================================================================== */
function ViewDocenteDashboard(){
  if(!APP.docenteAuth){ APP.view='docenteLogin'; setTimeout(render); return document.createElement('div'); }
  const esCuentaReal = !!APP.docenteAuth.uid;
  const wrap = document.createElement('div');
  const shell = document.createElement('div');
  shell.className='shell wide';
  shell.innerHTML = `
    <div class="flex-between" style="margin-bottom:18px;">
      <div>
        <span class="section-label">Panel docente ${esCuentaReal ? '· '+esc(APP.docenteAuth.nombre) : ''}</span>
        <h2 style="font-size:22px;">Mis pruebas</h2>
        <p class="muted" style="margin-top:4px;">Aquí solo ve las pruebas y calificaciones que usted ha creado. Cree una nueva o consulte el informe de cualquiera de las existentes.</p>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <button class="btn btn-gold" id="btnNueva">+ Nueva prueba</button>
        <button class="btn btn-ghost" id="btnCerrarSesion">Cerrar sesión</button>
      </div>
    </div>
    ${!esCuentaReal ? `
    <details style="margin-bottom:18px;">
      <summary class="btn btn-ghost btn-sm" style="display:inline-block; list-style:none;">⚙ Cambiar clave de acceso (modo local)</summary>
      <div class="card" style="margin-top:10px; max-width:420px;">
        <label class="field-label">Clave actual</label>
        <input type="password" id="pinActualInput" placeholder="Clave actual">
        <label class="field-label" style="margin-top:10px;">Nueva clave</label>
        <input type="password" id="pinNuevaInput" placeholder="Mínimo 4 caracteres">
        <label class="field-label" style="margin-top:10px;">Confirmar nueva clave</label>
        <input type="password" id="pinConfirmarInput" placeholder="Repita la nueva clave">
        <div id="pinCambioMsg" style="display:none; margin-top:10px;"></div>
        <button class="btn btn-primary" id="btnGuardarPin" style="margin-top:14px;">Guardar nueva clave</button>
      </div>
    </details>` : ''}
    <div id="listaPruebas" class="card"><p class="muted">Cargando pruebas…</p></div>
  `;
  wrap.appendChild(shell);
  setTimeout(async ()=>{
    document.getElementById('btnNueva').onclick=()=>{ APP.view='docenteCrear'; render(); };
    document.getElementById('btnCerrarSesion').onclick=async ()=>{
      if(window.authAdapter) await window.authAdapter.cerrarSesion();
      APP.docenteAuth = null; APP.ctx = {}; APP.view='home'; render();
    };
    const btnGuardarPin = document.getElementById('btnGuardarPin');
    if(btnGuardarPin) btnGuardarPin.onclick = async ()=>{
      const actual = document.getElementById('pinActualInput').value;
      const nueva = document.getElementById('pinNuevaInput').value.trim();
      const confirmar = document.getElementById('pinConfirmarInput').value.trim();
      const msg = document.getElementById('pinCambioMsg');
      msg.style.display='block';
      const pinVigente = await getPinVigente();
      if(actual !== pinVigente){
        msg.className='notice danger'; msg.textContent='La clave actual no es correcta.'; return;
      }
      if(nueva.length < 4){
        msg.className='notice danger'; msg.textContent='La nueva clave debe tener al menos 4 caracteres.'; return;
      }
      if(nueva !== confirmar){
        msg.className='notice danger'; msg.textContent='La nueva clave y su confirmación no coinciden.'; return;
      }
      const ok = await cambiarPin(nueva);
      if(ok){
        msg.className='notice success'; msg.textContent='Clave actualizada correctamente. Úsela la próxima vez que ingrese al panel.';
        document.getElementById('pinActualInput').value='';
        document.getElementById('pinNuevaInput').value='';
        document.getElementById('pinConfirmarInput').value='';
      } else {
        msg.className='notice danger'; msg.textContent='No se pudo guardar la nueva clave (fallo de almacenamiento). Intente de nuevo.';
      }
    };
    const keysAll = await stList('test:');
    const cont = document.getElementById('listaPruebas');
    if(!keysAll.length){
      cont.innerHTML = `<div class="empty-state"><h3>Aún no hay pruebas creadas</h3><p>Use "+ Nueva prueba" para subir el documento de preguntas de un módulo y generar el código de acceso.</p></div>`;
      return;
    }
    const todos = (await Promise.all(keysAll.map(k=>stGet(k)))).filter(Boolean);
    // cada docente solo ve las pruebas creadas con su propia cuenta;
    // en modo local (sin cuentas) se muestran todas, ya que solo hay un usuario.
    const tests = (esCuentaReal ? todos.filter(t=> t.profesorUid === APP.docenteAuth.uid) : todos)
      .sort((a,b)=>b.creado-a.creado);
    if(esCuentaReal && !tests.length && todos.length){
      cont.innerHTML = `<div class="empty-state"><h3>Aún no ha creado ninguna prueba con esta cuenta</h3><p>Use "+ Nueva prueba" para empezar. (Hay pruebas de otras cuentas en esta plataforma, pero no se muestran aquí.)</p></div>`;
      return;
    }
    if(!tests.length){
      cont.innerHTML = `<div class="empty-state"><h3>Aún no hay pruebas creadas</h3><p>Use "+ Nueva prueba" para subir el documento de preguntas de un módulo y generar el código de acceso.</p></div>`;
      return;
    }
    // estadísticas rápidas por prueba: cantidad de intentos y promedio del grupo
    const stats = await Promise.all(tests.map(async t=>{
      const akeys = await stList('intento:'+t.id+':');
      const intentos = (await Promise.all(akeys.map(k=>stGet(k)))).filter(Boolean);
      const finalizados = intentos.filter(a=>a.estado==='finalizado');
      const anulados = intentos.filter(a=>a.estado==='anulado');
      const promedio = finalizados.length ? finalizados.reduce((s,a)=>s+(a.calificacion||0),0)/finalizados.length : null;
      return { total: intentos.length, finalizados: finalizados.length, anulados: anulados.length, promedio };
    }));
    const statsById = {};
    tests.forEach((t,i)=> statsById[t.id] = stats[i]);

    // agrupar por asignatura
    const asignaturas = [...new Set(tests.map(t=> t.asignatura || 'Sin asignatura'))].sort((a,b)=>a.localeCompare(b,'es'));

    function filaPrueba(t){
      const s = statsById[t.id];
      const promTxt = s.promedio!=null ? s.promedio.toFixed(1) : '—';
      return `<tr>
          <td><b>${esc(t.modulo)}</b><br><span class="muted">${esc(t.titulo||'')}</span>${t.profesor?`<br><span class="muted" style="font-size:11.5px;">👤 ${esc(t.profesor)}</span>`:''}</td>
          <td><span class="pill">${t.tipoPrueba==='parcial'?'Parcial Integrador':'Prueba Corta'}</span></td>
          <td><span class="mono">${esc(t.codigo)}</span></td>
          <td>${t.preguntas.length}</td>
          <td>${s.total ? `${s.finalizados} finalizado(s)${s.anulados?` · ${s.anulados} anulado(s)`:''}` : '<span class="muted">sin intentos</span>'}</td>
          <td><b>${promTxt}</b>${s.promedio!=null?' / 100':''}</td>
          <td class="muted">${new Date(t.creado).toLocaleDateString('es-PA')}</td>
          <td style="text-align:right; white-space:nowrap;">
            <button class="btn btn-primary btn-sm" data-report="${t.id}">📊 Ver calificaciones</button>
            <button class="btn btn-ghost btn-sm" data-link="${t.codigo}">Copiar código</button>
            <button class="btn btn-ghost btn-sm" data-eliminar="${t.id}" style="color:var(--danger); border-color:#E4B3A9;">🗑</button>
          </td>
        </tr>`;
    }

    function grupoHTML(asignatura){
      const testsGrupo = tests.filter(t=> (t.asignatura || 'Sin asignatura') === asignatura);
      return `
        <div class="flex-between" style="margin:22px 0 10px;">
          <h3 style="font-size:16px; color:var(--navy-deep);">📚 ${esc(asignatura)} <span class="muted" style="font-weight:400; font-size:13px;">(${testsGrupo.length} prueba${testsGrupo.length===1?'':'s'})</span></h3>
          <button class="btn btn-ghost btn-sm" data-informe-asignatura="${esc(asignatura)}">📑 Informe consolidado de la asignatura</button>
        </div>
        <table class="report"><thead><tr>
          <th>Módulo</th><th>Tipo</th><th>Código</th><th>Preguntas</th><th>Intentos</th><th>Promedio</th><th>Creado</th><th></th>
        </tr></thead><tbody>
          ${testsGrupo.map(filaPrueba).join('')}
        </tbody></table>`;
    }

    function pintar(filtro){
      const lista = (filtro && filtro!=='todas') ? [filtro] : asignaturas;
      cont.innerHTML = `
        <div class="flex-between" style="margin-bottom:4px;">
          <label class="field-label" style="margin-bottom:0;">Filtrar por asignatura</label>
        </div>
        <select id="filtroAsignatura" style="max-width:360px;">
          <option value="todas">Todas las asignaturas (${asignaturas.length})</option>
          ${asignaturas.map(a=>`<option value="${esc(a)}" ${filtro===a?'selected':''}>${esc(a)}</option>`).join('')}
        </select>
        ${lista.map(grupoHTML).join('')}
      `;
      document.getElementById('filtroAsignatura').onchange = e=> pintar(e.target.value);
      cont.querySelectorAll('[data-report]').forEach(b=>{
        b.onclick=()=>{ APP.ctx.testId=b.getAttribute('data-report'); APP.view='docenteReporte'; render(); };
      });
      cont.querySelectorAll('[data-informe-asignatura]').forEach(b=>{
        b.onclick=()=>{ APP.ctx.asignaturaReporte = b.getAttribute('data-informe-asignatura'); APP.view='docenteReporteAsignatura'; render(); };
      });
      cont.querySelectorAll('[data-link]').forEach(b=>{
        b.onclick=()=>{
          const codigo=b.getAttribute('data-link');
          const url = location.href.split('#')[0] + '#codigo=' + codigo;
          navigator.clipboard && navigator.clipboard.writeText(url).catch(()=>{});
          b.textContent='¡Copiado!';
          setTimeout(()=>{ b.textContent='Copiar código'; },1400);
        };
      });
      cont.querySelectorAll('[data-eliminar]').forEach(b=>{
        b.onclick=async ()=>{
          const testId = b.getAttribute('data-eliminar');
          const t = tests.find(x=>x.id===testId);
          if(!t) return;
          const s = statsById[testId];
          const avisoIntentos = s.total ? `\n\nEsta prueba ya tiene ${s.total} intento(s) de estudiantes registrados. Al eliminarla, esas calificaciones también se borrarán y no se podrán recuperar.` : '';
          const ok1 = confirm(`¿Eliminar la prueba "${t.titulo}"?${avisoIntentos}\n\nEsta acción no se puede deshacer.`);
          if(!ok1) return;
          const ok2 = confirm('Para confirmar: ¿está completamente seguro de eliminar esta prueba de forma permanente?');
          if(!ok2) return;
          b.disabled = true; b.textContent = '…';
          const akeys = await stList('intento:'+testId+':');
          for(const k of akeys){ await stDelete(k); }
          await stDelete('test:'+testId);
          APP.view = 'docenteDashboard';
          render();
        };
      });
    }
    pintar('todas');
  });
  return wrap;
}

    document.getElementById('fileInput').onchange = handleFile;
    document.getElementById('btnGenerar').onclick = generarPrueba;

      const profesores = await obtenerProfesores();
      const dlp = document.getElementById('listaProfesores');
      if(dlp) dlp.innerHTML = profesores.map(p=>`<option value="${esc(p)}"></option>`).join('');
    }
  });

  async function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('uploadStatus');
    statusEl.innerHTML = `<p class="muted" style="margin-top:8px;">Procesando documento "${esc(file.name)}"…</p>`;
    const esDocx = /\.docx$/i.test(file.name);
    if(esDocx && (window.__MAMMOTH_FAILED || typeof mammoth === 'undefined')){
      statusEl.innerHTML = `<div class="notice danger" style="margin-top:10px;">No se pudo cargar el componente para leer archivos .docx (posiblemente bloqueado por su red, firewall o un bloqueador de anuncios). Intente con un archivo <b>.txt</b> con el mismo formato, revise su conexión a internet, o agregue las preguntas manualmente abajo.</div>`;
      return;
    }
    try{
      let text = '';
      if(esDocx){
        const buf = await file.arrayBuffer();
        const result = await mammoth.extractRawText({arrayBuffer: buf});
        text = result.value;
      } else if(/\.txt$/i.test(file.name)){
        text = await file.text();
      } else {
        statusEl.innerHTML = `<div class="notice warn" style="margin-top:10px;">Formato no admitido. Suba un archivo .docx o .txt.</div>`;
        return;
      }
      const { meta, preguntas } = parseDocumento(text);
      if(meta.asignatura){ d.asignatura = meta.asignatura; const el=document.getElementById('fAsignatura'); if(el) el.value = meta.asignatura; }
      if(meta.profesor){ d.profesor = meta.profesor; const el=document.getElementById('fProfesor'); if(el) el.value = meta.profesor; }
      if(meta.modulo){ d.modulo = meta.modulo; const el=document.getElementById('fModulo'); if(el) el.value = meta.modulo; }
      if(meta.instrucciones){ d.instrucciones = meta.instrucciones; const el=document.getElementById('fInstrucciones'); if(el) el.value = meta.instrucciones; }
      if(meta.tipoPrueba){ d.tipoPrueba = meta.tipoPrueba; const el=document.getElementById('fTipo'); if(el) el.value = meta.tipoPrueba; }
      if(preguntas.length){
        d.preguntas = d.preguntas.concat(preguntas);
        statusEl.innerHTML = `<div class="notice success" style="margin-top:10px;">Se importaron <b>${preguntas.length}</b> pregunta(s) del documento "${esc(file.name)}" correctamente.</div>`;
        renderListaPreguntas();
      } else {
        statusEl.innerHTML = `<div class="notice warn" style="margin-top:10px;">El documento se leyó (${text.length} caracteres), pero no se detectaron preguntas con el formato esperado (etiquetas <span class="mono">PREGUNTA:</span>, <span class="mono">TIPO_PREGUNTA:</span>, <span class="mono">RESPUESTA:</span>, etc.). Revise el formato mostrado arriba, o agregue las preguntas manualmente.</div>`;
      }
      e.target.value = '';
    }catch(err){
      console.error('Error al procesar documento:', err);
      statusEl.innerHTML = `<div class="notice danger" style="margin-top:10px;">No se pudo leer el documento: <span class="mono">${esc(err && err.message ? err.message : String(err))}</span>. Verifique que sea un .docx o .txt válido, o revise la consola del navegador (F12) para más detalles.</div>`;
    }
  }

  function renderListaPreguntas(){
    const cont = document.getElementById('listaPreguntas');
    if(!cont) return;
    if(!d.preguntas.length){
      cont.innerHTML = `<p class="muted">No hay preguntas cargadas todavía. Suba un documento o agregue preguntas manualmente.</p>`;
    } else {
      cont.innerHTML = d.preguntas.map((p,i)=>QEditorHTML(p,i)).join('');
      d.preguntas.forEach((p,i)=> bindQEditor(p,i));
    }
    const totalPuntos = d.preguntas.reduce((a,p)=>a+(p.puntos||0),0);
    const resumen = document.getElementById('resumenPuntos');
    if(resumen){
      resumen.textContent = d.preguntas.length
        ? `${d.preguntas.length} pregunta(s) · puntos asignados: ${totalPuntos || 'se repartirán 100 pts automáticamente'}`
        : '';
    }
  }

  function QEditorHTML(p,i){
    return `<div class="q-editor" data-qi="${i}">
      <div class="row-top">
        <span class="idx">PREGUNTA ${String(i+1).padStart(2,'0')}</span>
        <button class="small-x" data-del="${i}">✕ eliminar</button>
      </div>
      <label class="field-label">Enunciado</label>
      <textarea data-f="texto" style="font-family:'Inter',sans-serif; min-height:50px;" placeholder="Escriba la pregunta...">${esc(p.texto)}</textarea>
      <div class="grid2" style="margin-top:10px;">
        <div>
          <label class="field-label">Tipo</label>
          <select data-f="tipo">
            <option value="seleccion" ${p.tipo==='seleccion'?'selected':''}>Selección múltiple</option>
            <option value="vf" ${p.tipo==='vf'?'selected':''}>Verdadero / Falso</option>
            <option value="corta" ${p.tipo==='corta'?'selected':''}>Respuesta corta</option>
          </select>
        </div>
        <div>
          <label class="field-label">Puntos (opcional)</label>
          <input type="number" min="0" step="0.5" data-f="puntos" value="${p.puntos||''}" placeholder="auto">
        </div>
      </div>
      <div data-opts style="margin-top:10px;"></div>
      <div style="margin-top:10px;">
        <label class="field-label">Respuesta correcta</label>
        ${p.tipo==='vf'
          ? `<select data-f="respuesta">
               <option value="Verdadero" ${p.respuesta==='Verdadero'?'selected':''}>Verdadero</option>
               <option value="Falso" ${p.respuesta==='Falso'?'selected':''}>Falso</option>
             </select>`
          : `<input type="text" data-f="respuesta" value="${esc(p.respuesta)}" placeholder="${p.tipo==='corta'?'Texto esperado de la respuesta':'Debe coincidir con una de las opciones'}">`}
      </div>
    </div>`;
  }

  function bindQEditor(p,i){
    const box = document.querySelector(`.q-editor[data-qi="${i}"]`);
    if(!box) return;
    box.querySelector('[data-del]').onclick = ()=>{ d.preguntas.splice(i,1); renderListaPreguntas(); };
    box.querySelector('[data-f="texto"]').oninput = e=> p.texto = e.target.value;
    box.querySelector('[data-f="puntos"]').oninput = e=> p.puntos = parseFloat(e.target.value)||null;
    box.querySelector('[data-f="tipo"]').onchange = e=>{ p.tipo = e.target.value; if(p.tipo==='vf'){p.opciones=['Verdadero','Falso']; p.respuesta='Verdadero';} else if(p.tipo==='seleccion' && p.opciones.length<2){ p.opciones=['','']; } else if(p.tipo==='corta'){p.respuesta='';} renderListaPreguntas(); };
    const respField = box.querySelector('[data-f="respuesta"]');
    if(respField) respField.addEventListener(respField.tagName==='SELECT'?'change':'input', e=> p.respuesta = e.target.value);

    const optsBox = box.querySelector('[data-opts]');
    if(p.tipo==='seleccion'){
      optsBox.innerHTML = `<label class="field-label">Opciones</label>` +
        p.opciones.map((o,oi)=>`
          <div class="opt-edit-row">
            <input type="text" data-opt="${oi}" value="${esc(o)}" placeholder="Opción ${oi+1}">
            <button class="small-x" data-optdel="${oi}">✕</button>
          </div>`).join('') +
        `<button class="btn btn-ghost btn-sm" data-optadd style="margin-top:4px;">+ opción</button>`;
      optsBox.querySelectorAll('[data-opt]').forEach(inp=>{
        inp.oninput = e=>{ p.opciones[+inp.getAttribute('data-opt')] = e.target.value; };
      });
      optsBox.querySelectorAll('[data-optdel]').forEach(btn=>{
        btn.onclick = ()=>{ p.opciones.splice(+btn.getAttribute('data-optdel'),1); renderListaPreguntas(); };
      });
      const addBtn = optsBox.querySelector('[data-optadd]');
      if(addBtn) addBtn.onclick = ()=>{ p.opciones.push(''); renderListaPreguntas(); };
    } else {
      optsBox.innerHTML = '';
    }
  }

  async function generarPrueba(){
    const errs = [];
    if(!d.asignatura.trim()) errs.push('Indique la asignatura.');
    if(!d.modulo.trim()) errs.push('Indique el módulo.');
    if(!d.preguntas.length) errs.push('Agregue al menos una pregunta.');
    if(d.fechaInicio && d.fechaFin && d.fechaFin < d.fechaInicio) errs.push('La fecha final no puede ser anterior a la fecha de inicio.');
    if(d.tipoTiempo==='total' && (!d.duracionMinutos || isNaN(parseInt(d.duracionMinutos,10)) || parseInt(d.duracionMinutos,10) <= 0)) errs.push('Indique la duración máxima de la prueba en minutos (mayor a 0), o cambie el control de tiempo a "Sin límite".');
    if(d.tipoTiempo==='porPregunta' && (!d.minutosPorPregunta || isNaN(parseInt(d.minutosPorPregunta,10)) || parseInt(d.minutosPorPregunta,10) <= 0)) errs.push('Indique los minutos permitidos por pregunta (mayor a 0), o cambie el control de tiempo a "Sin límite".');
    d.preguntas.forEach((p,i)=>{
      if(!p.texto.trim()) errs.push(`La pregunta ${i+1} no tiene enunciado.`);
      if(!p.respuesta || !String(p.respuesta).trim()) errs.push(`La pregunta ${i+1} no tiene respuesta correcta definida.`);
      if(p.tipo==='seleccion'){
        const opts = p.opciones.filter(o=>o.trim());
        if(opts.length<2) errs.push(`La pregunta ${i+1} necesita al menos 2 opciones.`);
        else if(!opts.some(o=>normText(o)===normText(p.respuesta))) errs.push(`La respuesta de la pregunta ${i+1} debe coincidir con una de sus opciones.`);
      }
    });
    if(errs.length){
      alert('Revise lo siguiente antes de generar la prueba:\n\n- ' + errs.join('\n- '));
      return;
    }
    const preguntasFinal = repartirPuntos(d.preguntas.map(p=>({...p, opciones: p.opciones ? p.opciones.filter(o=>o.trim()) : []})));
    const test = {
      id: uid(10),
      asignatura: d.asignatura.trim(),
      profesor: esCuentaReal ? APP.docenteAuth.nombre : d.profesor.trim(),
      profesorUid: esCuentaReal ? APP.docenteAuth.uid : null,
      modulo: d.modulo.trim(),
      titulo: d.titulo.trim() || d.modulo.trim(),
      tipoPrueba: d.tipoPrueba,
      instrucciones: d.instrucciones.trim(),
      fechaInicio: d.fechaInicio || null,
      fechaFin: d.fechaFin || null,
      tipoTiempo: d.tipoTiempo || 'ninguno',
      duracionMinutos: d.tipoTiempo==='total' ? parseInt(d.duracionMinutos,10) : null,
      minutosPorPregunta: d.tipoTiempo==='porPregunta' ? parseInt(d.minutosPorPregunta,10) : null,
      preguntas: preguntasFinal,
      valorTotal: 100,
      codigo: genCodigo(d.asignatura || d.modulo),
      creado: Date.now(),
      activo: true,
    };
    const btn = document.getElementById('btnGenerar');
    if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
    const guardado = await stSet('test:'+test.id, test, esCuentaReal ? { profesorUid: test.profesorUid } : undefined);
    if(!guardado){
      if(btn){ btn.disabled = false; btn.textContent = 'Generar prueba y código de acceso'; }
      alert('No se pudo guardar la prueba en el almacenamiento.\n\nEsto suele pasar cuando el archivo se abre directamente con doble clic (file://) en navegadores con políticas de privacidad o empresariales estrictas.\n\nSoluciones:\n1) Abra la app mediante un servidor local (por ejemplo "python -m http.server" y luego http://localhost:8000) en vez de doble clic.\n2) O configure Firebase (ver README.md) y pruebe la app ya publicada en su sitio — es la forma recomendada para uso real con estudiantes.');
      return;
    }
    await registrarAsignatura(test.asignatura);
    await registrarProfesor(test.profesor);
    APP.ctx.draft = null;
    APP.ctx.testId = test.id;
    APP.ctx.nuevoCodigo = test.codigo;
    APP.view='docenteReporte';
    render();
  }

  return wrap;
}

function ViewDocenteReporte(){
  if(!APP.docenteAuth){ APP.view='docenteLogin'; setTimeout(render); return document.createElement('div'); }
  const wrap = document.createElement('div');
  const shell = document.createElement('div');
  shell.className='shell wide';
  shell.innerHTML = `<div id="repRoot"><p class="muted">Cargando informe…</p></div>`;
  wrap.appendChild(shell);

  setTimeout(async ()=>{
    const test = await stGet('test:'+APP.ctx.testId);
    const root = document.getElementById('repRoot');
    if(!test){ root.innerHTML = `<div class="notice danger">Prueba no encontrada.</div>`; return; }
    if(APP.docenteAuth.uid && test.profesorUid && test.profesorUid !== APP.docenteAuth.uid){
      root.innerHTML = `<div class="notice danger">Esta prueba pertenece a otra cuenta de docente. No tiene permiso para ver su informe.</div>`;
      return;
    }

    const nuevoCodigoBanner = APP.ctx.nuevoCodigo ? `
      <div class="notice success" style="margin-bottom:18px;">
        Prueba generada correctamente. Comparta el siguiente código de acceso único con sus estudiantes:
        <div style="margin-top:10px;"><span class="code-chip">${esc(test.codigo)} <span class="bars">${[6,10,4,8,5,9,3].map(h=>`<span style="height:${h}px;"></span>`).join('')}</span></span></div>
        <div style="margin-top:10px;">Enlace directo: <span class="mono" id="linkDirecto" style="word-break:break-all;">${location.href.split('#')[0]}#codigo=${test.codigo}</span>
        <button class="btn btn-ghost btn-sm" id="btnCopyLink" style="margin-left:8px;">Copiar</button></div>
      </div>` : '';

    const keys = await stList('intento:'+test.id+':');
    const intentos = (await Promise.all(keys.map(k=>stGet(k)))).filter(Boolean);
    intentos.sort((a,b)=>(b.horaInicioTs||0)-(a.horaInicioTs||0));

    root.innerHTML = `
      ${nuevoCodigoBanner}
      <div class="flex-between">
        <span class="section-label" style="margin-bottom:0;">Informe de calificaciones — solo visible para el docente</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost btn-sm" id="btnVolverPanel">◂ Ver todas las pruebas</button>
          <button class="btn btn-ghost btn-sm" id="btnEliminarPrueba" style="color:var(--danger); border-color:#E4B3A9;">🗑 Eliminar prueba</button>
        </div>
      </div>
      <div class="flex-between" style="margin-bottom:10px; margin-top:6px;">
        <div>
          <h2 style="font-size:21px;">${esc(test.titulo)}</h2>
          ${test.profesor ? `<p class="muted" style="margin-top:2px;">Docente: ${esc(test.profesor)}</p>` : ''}
        </div>
        <span class="pill">📚 ${esc(test.asignatura||'Sin asignatura')} · ${test.tipoPrueba==='parcial'?'Parcial Integrador':'Prueba Corta'} · Código ${esc(test.codigo)}</span>
      </div>
      ${(test.fechaInicio || test.fechaFin || test.duracionMinutos) ? `<p class="muted" style="margin-bottom:10px;">
        ${test.fechaInicio ? `📅 Disponible desde: <b>${esc(test.fechaInicio)}</b>` : ''}
        ${test.fechaInicio && test.fechaFin ? ' · ' : ''}
        ${test.fechaFin ? `Hasta: <b>${esc(test.fechaFin)}</b>` : ''}
        ${(test.fechaInicio || test.fechaFin) && test.duracionMinutos ? ' · ' : ''}
        ${test.duracionMinutos ? `⏱ Duración máxima: <b>${test.duracionMinutos} min</b>` : ''}
      </p>` : ''}
      <div class="card">
        ${!intentos.length ? `<div class="empty-state"><h3>Sin intentos registrados</h3><p>Aún ningún estudiante ha presentado esta prueba.</p></div>` : `
        <table class="report">
          <thead><tr>
            <th>Estudiante</th><th>Cédula</th><th>Fecha</th><th>Inicio</th><th>Fin</th>
            <th>Duración total</th><th>Calificación</th><th>Estado</th><th></th>
          </tr></thead>
          <tbody>
            ${intentos.map((a,i)=>`
              <tr>
                <td><b>${esc(a.nombre)}</b></td>
                <td class="mono">${esc(a.cedula)}</td>
                <td>${esc(a.fecha)}</td>
                <td class="mono">${esc(a.horaInicio||'—')}</td>
                <td class="mono">${esc(a.horaFin||'—')}</td>
                <td>${a.duracionSeg!=null ? fmtDuration(a.duracionSeg) : '—'}</td>
                <td><b>${a.estado==='finalizado' ? (a.calificacion!=null?a.calificacion.toFixed(1):'—') : (a.estado==='anulado' ? '0.0' : '—')}</b> / 100</td>
                <td>${a.estado==='finalizado' ? '<span class="badge ok">Finalizado</span>' : a.estado==='anulado' ? '<span class="badge bad">Anulado</span>' : '<span class="badge progress">En curso</span>'}</td>
                <td><button class="btn btn-ghost btn-sm" data-det="${i}">Detalle</button></td>
              </tr>
              <tr id="det-${i}" style="display:none;"><td colspan="9">${DetalleIntentoHTML(a,test)}</td></tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
      ${intentos.length ? `
      <div class="card">
        <span class="section-label">Estadísticas del grupo</span>
        ${EstadisticasHTML(intentos)}
      </div>` : ''}
    `;

    const copyBtn = document.getElementById('btnCopyLink');
    if(copyBtn) copyBtn.onclick=()=>{
      const t = document.getElementById('linkDirecto').textContent;
      navigator.clipboard && navigator.clipboard.writeText(t).catch(()=>{});
      copyBtn.textContent='¡Copiado!'; setTimeout(()=>copyBtn.textContent='Copiar',1400);
    };
    const volverBtn = document.getElementById('btnVolverPanel');
    if(volverBtn) volverBtn.onclick = ()=>{ APP.ctx.nuevoCodigo=null; APP.view='docenteDashboard'; render(); };
    const btnEliminar = document.getElementById('btnEliminarPrueba');
    if(btnEliminar) btnEliminar.onclick = async ()=>{
      const avisoIntentos = intentos.length ? `\n\nEsta prueba ya tiene ${intentos.length} intento(s) de estudiantes registrados. Al eliminarla, esas calificaciones también se borrarán y no se podrán recuperar.` : '';
      const ok1 = confirm(`¿Eliminar la prueba "${test.titulo}"?${avisoIntentos}\n\nEsta acción no se puede deshacer.`);
      if(!ok1) return;
      const ok2 = confirm('Para confirmar: ¿está completamente seguro de eliminar esta prueba de forma permanente?');
      if(!ok2) return;
      btnEliminar.disabled = true; btnEliminar.textContent = '…';
      for(const k of keys){ await stDelete(k); }
      await stDelete('test:'+test.id);
      APP.ctx.nuevoCodigo = null;
      APP.view = 'docenteDashboard';
      render();
    };
    root.querySelectorAll('[data-det]').forEach(b=>{
      b.onclick=()=>{
        const row = document.getElementById('det-'+b.getAttribute('data-det'));
        row.style.display = row.style.display==='none' ? '' : 'none';
      };
    });
  });

  return wrap;
}

function EstadisticasHTML(intentos){
  const finalizados = intentos.filter(a=>a.estado==='finalizado');
  const anulados = intentos.filter(a=>a.estado==='anulado');
  const promedio = finalizados.length ? (finalizados.reduce((s,a)=>s+(a.calificacion||0),0)/finalizados.length) : 0;
  const durProm = finalizados.length ? (finalizados.reduce((s,a)=>s+(a.duracionSeg||0),0)/finalizados.length) : 0;
  return `
    <div class="grid2">
      <div><div class="k mono" style="font-size:11px; color:var(--ink-soft);">PROMEDIO DEL GRUPO</div><div style="font-size:26px; font-weight:700; font-family:'Source Serif 4',serif;">${promedio.toFixed(1)} / 100</div></div>
      <div><div class="k mono" style="font-size:11px; color:var(--ink-soft);">TIEMPO PROMEDIO</div><div style="font-size:26px; font-weight:700; font-family:'Source Serif 4',serif;">${fmtDuration(durProm)}</div></div>
    </div>
    <p class="muted" style="margin-top:12px;">${finalizados.length} finalizada(s) · ${anulados.length} anulada(s) por abandono de pantalla · ${intentos.length} intento(s) totales.</p>
  `;
}

function DetalleIntentoHTML(a, test){
  if(a.estado==='anulado'){
    return `<div class="notice danger">Intento anulado: ${esc(a.motivoAnulacion||'el estudiante salió de la aplicación durante la prueba.')}</div>`;
  }
  if(!a.respuestas) return `<p class="muted">Sin respuestas registradas (intento en curso).</p>`;
  return `<table class="report" style="margin-top:6px;">
    <thead><tr><th>Pregunta</th><th>Respuesta del estudiante</th><th>Correcta</th><th>Puntos</th><th>Tiempo usado</th></tr></thead>
    <tbody>
    ${a.respuestas.map(r=>{
      const preg = test.preguntas.find(p=>p.id===r.preguntaId);
      const correcta = preg ? evaluarRespuesta(preg, r.respuesta) : false;
      return `<tr>
        <td>${esc(preg?preg.texto:'—')}</td>
        <td>${esc(r.respuesta||'(sin responder)')}</td>
        <td>${correcta?'<span class="badge ok">✓</span>':'<span class="badge bad">✗</span>'}</td>
        <td>${correcta?(preg.puntos||0):0} / ${preg?preg.puntos:0}</td>
        <td class="mono">${fmtDuration(r.tiempoSegundos||0)}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

/* VIEW: DOCENTE — INFORME CONSOLIDADO POR ASIGNATURA                    */

function ViewDocenteReporteAsignatura(){
  if(!APP.docenteAuth){ APP.view='docenteLogin'; setTimeout(render); return document.createElement('div'); }
  const asignatura = APP.ctx.asignaturaReporte;
  const wrap = document.createElement('div');
  const shell = document.createElement('div');
  shell.className='shell wide';
  shell.innerHTML = `<div id="repAsigRoot"><p class="muted">Cargando informe de la asignatura…</p></div>`;
  wrap.appendChild(shell);

  setTimeout(async ()=>{
    const root = document.getElementById('repAsigRoot');
    if(!asignatura){ root.innerHTML = `<div class="notice danger">No se indicó una asignatura.</div>`; return; }

    const keys = await stList('test:');
    const todos = (await Promise.all(keys.map(k=>stGet(k)))).filter(Boolean);
    const propios = APP.docenteAuth.uid ? todos.filter(t=> t.profesorUid === APP.docenteAuth.uid) : todos;
    const tests = propios.filter(t=> (t.asignatura || 'Sin asignatura') === asignatura).sort((a,b)=>a.creado-b.creado);

    if(!tests.length){
      root.innerHTML = `
        <div class="flex-between"><span class="section-label" style="margin-bottom:0;">Informe consolidado — solo visible para el docente</span>
        <button class="btn btn-ghost btn-sm" id="btnVolverPanel2">◂ Ver todas las pruebas</button></div>
        <h2 style="font-size:21px; margin:8px 0 16px;">📚 ${esc(asignatura)}</h2>
        <div class="card"><div class="empty-state"><h3>Sin pruebas en esta asignatura</h3></div></div>`;
      const v = document.getElementById('btnVolverPanel2');
      if(v) v.onclick = ()=>{ APP.view='docenteDashboard'; render(); };
      return;
    }

    // recopilar todos los intentos de todas las pruebas de esta asignatura
    const porEstudiante = {}; // cedula -> { nombre, cedula, filas: [{testTitulo, tipoPrueba, calificacion, estado, fecha}], promedio }
    for(const t of tests){
      const akeys = await stList('intento:'+t.id+':');
      const intentos = (await Promise.all(akeys.map(k=>stGet(k)))).filter(Boolean);
      intentos.forEach(a=>{
        if(!porEstudiante[a.cedula]) porEstudiante[a.cedula] = { nombre:a.nombre, cedula:a.cedula, filas:[] };
        porEstudiante[a.cedula].filas.push({
          testTitulo: t.titulo, tipoPrueba: t.tipoPrueba,
          calificacion: a.estado==='finalizado' ? a.calificacion : (a.estado==='anulado' ? 0 : null),
          estado: a.estado, fecha: a.fecha
        });
      });
    }
    const estudiantes = Object.values(porEstudiante).map(e=>{
      const validas = e.filas.filter(f=>f.calificacion!=null);
      e.promedio = validas.length ? validas.reduce((s,f)=>s+f.calificacion,0)/validas.length : null;
      return e;
    }).sort((a,b)=> (b.promedio||0)-(a.promedio||0));

    const promedioGeneral = estudiantes.length
      ? estudiantes.filter(e=>e.promedio!=null).reduce((s,e,_,arr)=>s+e.promedio/arr.length,0)
      : 0;

    root.innerHTML = `
      <div class="flex-between"><span class="section-label" style="margin-bottom:0;">Informe consolidado — solo visible para el docente</span>
      <button class="btn btn-ghost btn-sm" id="btnVolverPanel2">◂ Ver todas las pruebas</button></div>
      <h2 style="font-size:21px; margin:8px 0 16px;">📚 ${esc(asignatura)}</h2>
      <div class="card">
        <span class="section-label">Pruebas incluidas en este informe (${tests.length})</span>
        <p class="muted" style="margin-top:6px;">${tests.map(t=>esc(t.titulo)+' ('+(t.tipoPrueba==='parcial'?'Parcial':'Corta')+')').join(' · ')}</p>
      </div>
      <div class="card">
        <div class="grid2">
          <div><div class="k mono" style="font-size:11px; color:var(--ink-soft);">PROMEDIO GENERAL DE LA ASIGNATURA</div><div style="font-size:26px; font-weight:700; font-family:'Source Serif 4',serif;">${promedioGeneral.toFixed(1)} / 100</div></div>
          <div><div class="k mono" style="font-size:11px; color:var(--ink-soft);">ESTUDIANTES CON AL MENOS UN INTENTO</div><div style="font-size:26px; font-weight:700; font-family:'Source Serif 4',serif;">${estudiantes.length}</div></div>
        </div>
      </div>
      <div class="card">
        <span class="section-label">Desglose por estudiante</span>
        ${!estudiantes.length ? `<div class="empty-state"><h3>Sin intentos registrados todavía</h3></div>` : `
        <table class="report" style="margin-top:10px;">
          <thead><tr><th>Estudiante</th><th>Cédula</th><th>Pruebas presentadas</th><th>Promedio en la asignatura</th><th></th></tr></thead>
          <tbody>
            ${estudiantes.map((e,i)=>`
              <tr>
                <td><b>${esc(e.nombre)}</b></td>
                <td class="mono">${esc(e.cedula)}</td>
                <td>${e.filas.length} de ${tests.length}</td>
                <td><b>${e.promedio!=null?e.promedio.toFixed(1):'—'}</b>${e.promedio!=null?' / 100':''}</td>
                <td><button class="btn btn-ghost btn-sm" data-det-est="${i}">Detalle</button></td>
              </tr>
              <tr id="det-est-${i}" style="display:none;"><td colspan="5">
                <table class="report">
                  <thead><tr><th>Prueba</th><th>Tipo</th><th>Fecha</th><th>Calificación</th><th>Estado</th></tr></thead>
                  <tbody>
                    ${e.filas.map(f=>`<tr>
                      <td>${esc(f.testTitulo)}</td>
                      <td>${f.tipoPrueba==='parcial'?'Parcial Integrador':'Prueba Corta'}</td>
                      <td>${esc(f.fecha)}</td>
                      <td><b>${f.calificacion!=null?f.calificacion.toFixed(1):'—'}</b> / 100</td>
                      <td>${f.estado==='finalizado'?'<span class="badge ok">Finalizado</span>':f.estado==='anulado'?'<span class="badge bad">Anulado</span>':'<span class="badge progress">En curso</span>'}</td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </td></tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
    `;
    document.getElementById('btnVolverPanel2').onclick = ()=>{ APP.view='docenteDashboard'; render(); };
    root.querySelectorAll('[data-det-est]').forEach(b=>{
      b.onclick=()=>{
        const row = document.getElementById('det-est-'+b.getAttribute('data-det-est'));
        row.style.display = row.style.display==='none' ? '' : 'none';
      };
    });
  });

  return wrap;
}

function ViewEstAcceso(){
  const wrap = document.createElement('div');
  wrap.appendChild(ManifestHeader());
  const shell = document.createElement('div');
  shell.className='shell';
  shell.style.maxWidth='480px';
  const prellenado = APP.ctx.codigoPrellenado || '';
  shell.innerHTML = `
    <div class="card">
      <span class="section-label">Acceso del estudiante</span>
      <h2 style="font-size:20px; margin-bottom:14px;">Ingrese el código de la prueba</h2>
      <p class="muted" style="margin-bottom:16px;">Escriba el código de acceso único compartido por su docente para esta prueba.</p>
      <label class="field-label">Código de acceso</label>
      <input type="text" id="codigoInput" class="mono" style="text-transform:uppercase;" placeholder="EJ: LOG-4F7K2" value="${esc(prellenado)}">
      <div id="codeError" class="notice danger" style="display:none; margin-top:10px;"></div>
      <button class="btn btn-primary btn-block" id="btnAcceder" style="margin-top:16px;">Continuar</button>
    </div>
  `;
  wrap.appendChild(shell);
  setTimeout(()=>{
    const input = document.getElementById('codigoInput');
    const tryAccess = async ()=>{
      const codigo = input.value.trim().toUpperCase();
      if(!codigo) return;
      const keys = await stList('test:');
      const tests = (await Promise.all(keys.map(k=>stGet(k)))).filter(Boolean);
      const test = tests.find(t=>t.codigo===codigo);
      const errBox = document.getElementById('codeError');
      if(!test){
        errBox.style.display='block';
        errBox.textContent='El código ingresado no corresponde a ninguna prueba activa. Verifique con su docente.';
        return;
      }
      APP.ctx.test = normalizarTiempoTest(test);
      APP.view='estDatos';
      render();
    };
    document.getElementById('btnAcceder').onclick = tryAccess;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryAccess(); });
    if(prellenado) tryAccess();
  });
  return wrap;
}
